name = "orphic-ranger"
tagline = "Earns swap fees on HYPE/USDC"
category = "experimental"
walletVmFamily = "evm"
agentId = "4daca677-56ce-4553-97c0-f0dea922b1d6"
actions = ["liquidity", "swap"]

[[triggers]]
type = "schedule"
everyMs = 900000
align = "rolling"

# USDC on Elysium; the agent buys the HYPE half itself.
[startingAsset]
network = "ethereum:99901"
asset = "0xb47c4c8f73f009cc0c0d3f92b388d13e293f0b65"
minimumAmount = "20"

[settings]
# How far either side of the current price the range reaches, in percent; narrower earns more while in range and leaves it sooner.
widthPct = { type = "number", default = 10, min = 2, max = 50 }
# If HYPE moves more than this percent in 24 hours the range is closed and everything sits in USDC until it calms.
flattenMovePct = { type = "number", default = 15, min = 5, max = 50 }
