name: rotator

on:
  schedule:
    # Hourly, with a second attempt at :37 because GitHub drops scheduled runs under load (9 Nov: nothing ran 07:00 to
    # 15:00 UTC). The tick is idempotent, so a second run in the same hour holds. The weekly close is detected inside the
    # keeper (Sunday 00:xx UTC).
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Force the weekly close step"
        required: false
        default: "false"

# Never let two ticks overlap. A new tick waits for the running one, it is not cancelled,
# because cancelling mid-plan could leave the vault half rotated.
concurrency:
  group: orphic-rotator
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: keeper
    env:
      RPC_URL: ${{ secrets.RPC_URL }}
      # Dry-run by default. Set the repository variable LIVE to "1" to allow broadcasting.
      LIVE: ${{ vars.LIVE == '1' && '1' || '0' }}
      # Only read while config/senior.json still has placeholder addresses.
      STATE_FIXTURE: test/fixtures/state.json
      OPS_DIR: ops
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keeper/package-lock.json

      - name: Install
        run: npm ci

      # The price record (7-day TWAP for the ORPH stake rate) must survive between hourly runs on a fresh runner.
      # Keys are unique per run so the save step always writes; restore-keys picks the newest previous one.
      - name: Restore price samples
        uses: actions/cache/restore@v4
        with:
          path: keeper/ops/price-samples.jsonl
          key: orph-price-samples-${{ github.run_id }}
          restore-keys: |
            orph-price-samples-

      - name: Test
        run: npm test

      # ROTATOR_MODE (repository variable): "keeper" runs the full tick from here (default); "watchdog" means the
      # Rotator runs on Circuit and this job only monitors, with permissionless fallbacks.
      - name: Tick
        if: vars.ROTATOR_MODE != 'watchdog'
        env:
          # Only injected when LIVE=1 so a dry-run job never even holds the key.
          AGENT_PRIVATE_KEY: ${{ vars.LIVE == '1' && secrets.AGENT_PRIVATE_KEY || '' }}
        run: |
          if [ "${{ github.event.inputs.weekly }}" = "true" ]; then
            npm run tick -- --weekly
          else
            npm run tick
          fi

      # Invariants every hour whatever the mode. EXPECTED_AGENT is the wallet that should hold the roles: the GitHub
      # agent in keeper mode, Circuit's wallet in watchdog mode. Exit 2 (red run, email) on any alert; Telegram when
      # TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets exist. Fallback calls are permissionless and only sent in
      # watchdog mode with LIVE=1.
      - name: Watchdog
        if: always()
        env:
          EXPECTED_AGENT: ${{ vars.EXPECTED_AGENT || '0xC772F0ea992236dA71Fa30b8899D71B680866956' }}
          AGENT_PRIVATE_KEY: ${{ vars.ROTATOR_MODE == 'watchdog' && vars.LIVE == '1' && secrets.AGENT_PRIVATE_KEY || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ vars.ROTATOR_MODE }}" = "watchdog" ]; then
            npm run watchdog
          else
            npm run watchdog -- --dry-run
          fi

      - name: Save price samples
        if: always()
        uses: actions/cache/save@v4
        with:
          path: keeper/ops/price-samples.jsonl
          key: orph-price-samples-${{ github.run_id }}

      # Position index for the Portfolio tab: folds vault events into per-address totals and commits the result
      # (the public RPC caps eth_getLogs at 1000 blocks, so the site cannot rebuild history on the fly).
      - name: Index positions
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        run: npx tsx src/indexer.ts

      - name: Commit position index
        if: always()
        working-directory: .
        run: |
          git config user.name "orphic-rotator"
          git config user.email "rotator@orphic.fi"
          git add keeper/ops/positions-state.json web/public/data/positions.json
          git diff --cached --quiet || (git commit -m "index: positions through block $(python3 -c "import json;print(json.load(open('keeper/ops/positions-state.json'))['lastBlock'])") [skip ci]" && git push)

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotator-${{ github.run_id }}
          path: |
            keeper/ops/last-plan.json
            keeper/ops/reports/*.json
          retention-days: 90
          if-no-files-found: ignore
